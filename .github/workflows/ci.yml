# What the shared Flarum workflows (backend.yml, frontend.yml) don't check:
# that composer.json is valid, and that the committed JS bundle — what forums
# actually load, never rebuilt on install — matches a fresh build of js/src.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer:
    name: composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

  js:
    name: JS bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'

      - name: Install
        working-directory: js
        run: npm ci

      - name: Format
        working-directory: js
        run: npm run format-check

      - name: Unit tests
        working-directory: js
        run: npm test

      - name: Build
        working-directory: js
        run: npm run build

      # js/dist is committed and is what forums load. If a build from the
      # committed source produces different bytes, the shipped bundle is not
      # the shipped source — which is invisible until someone debugs the wrong
      # code.
      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- js/dist; then
            echo "js/dist differs from a fresh build of js/src — run 'npm run build' in js/ and commit." >&2
            git diff --stat -- js/dist
            exit 1
          fi
